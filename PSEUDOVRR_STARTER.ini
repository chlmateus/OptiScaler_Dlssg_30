; Compatibility filename: this profile now configures the Adaptive Fixed-Refresh Pacing Controller.
; Merge these values into the [Framerate] section of this game's OptiScaler.ini.
; 143.999 Hz fixed-refresh + 2x FG synchronized-cadence starting profile.

[Framerate]
FramerateLimit=143.999
LimiterBackend=1
FrameLockMode=0
FrameLockSyncMode=0
FrameLockAdaptiveTiming=true
FrameLockAutoTune=true
FrameLockFGAware=true
FrameLockFGAutoTarget=true
FrameLockFGHeadroomHz=0.0
FrameLockFGCadenceSnap=true
FrameLockFGStutterGuard=true
FrameLockUseCustomRefresh=true
FrameLockCustomRefreshHz=143.999
FrameLockPseudoVrrEnabled=true
FrameLockPseudoVrrMode=2
FrameLockAdaptivePresentationMode=0
FrameLockPseudoVrrMinBaseFps=48.0
FrameLockPseudoVrrMaxBaseFps=71.9995
FrameLockPseudoVrrHeadroomPct=8.0
FrameLockPseudoVrrHysteresisFps=1.0
; Retained for old-profile compatibility; the new controller does not blend cadence/arbitrary targets.
FrameLockPseudoVrrCadenceStrength=0.0
